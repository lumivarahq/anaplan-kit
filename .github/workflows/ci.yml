name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + dev deps + ruff
        run: |
          python -m pip install --upgrade pip
          pip install ./tooling[dev] ruff
      - name: Ruff lint
        run: ruff check tooling
      - name: Ruff format check
        run: ruff format --check tooling
      - name: Pytest (offline, mocked HTTP)
        run: |
          cd tooling
          python -m pytest -q

  docs:
    name: Docs (links + conventions + markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Relative Markdown link check
        run: python tools/check_links.py .
      - name: Anaplan conventions lint (blueprints)
        run: python tools/lint_blueprints.py
      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md" "#**/node_modules/**"
