[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anaplan-kit"
version = "0.1.0"
description = "A small, typed Python client for the Anaplan REST API v2 (educational)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anaplan Data Modeler Kit contributors" }]
keywords = ["anaplan", "rest-api", "integration", "planning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[project.scripts]
anaplan-model = "anaplan_kit.modeling.cli:main"

[tool.setuptools]
packages = ["anaplan_kit", "anaplan_kit.modeling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["**/__pycache__"]

[tool.ruff.lint]
# pyflakes(F), pycodestyle(E/W), isort(I), pyupgrade(UP), flake8-bugbear(B)
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests may use long descriptive strings and assert-heavy style.
"tests/*" = ["E501"]
