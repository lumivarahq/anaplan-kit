[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anaplan-kit"
version = "0.1.0"
description = "A small, typed Python client for the Anaplan REST API v2 (educational)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anaplan Data Modeler Kit contributors" }]
keywords = ["anaplan", "rest-api", "integration", "planning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.28,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "responses>=0.23",
]

[tool.setuptools]
packages = ["anaplan_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
